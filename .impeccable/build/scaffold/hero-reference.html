<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: 01-otwarta-przestrzen.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@700&family=Mulish:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f1f4f4}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <figure class="r-hero-photo region plate" data-region="hero-photo"><img src="../../../prototype/assets/hero-open-sky.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-philosophy-ground region chrome" data-region="philosophy-ground"><!-- Milk background of the philosophy section below the hero, with separate text elements on top. --></div>
  <div class="r-nav-shell region chrome" data-region="nav-shell"><!-- Milk pill navigation background --></div>
  <div class="r-brand region text" data-region="brand"><!-- Typeset semantic UI text: agnieszka clarity --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-nav-about region text" data-region="nav-about"><!-- Typeset semantic UI text: O mnie --><p style="font-size:var(--r-nav-about-font);line-height:1.05;margin:0">nav-about</p></div>
  <div class="r-nav-offer region text" data-region="nav-offer"><!-- Typeset semantic UI text: Oferta --><p style="font-size:var(--r-nav-offer-font);line-height:1.05;margin:0">nav-offer</p></div>
  <div class="r-nav-workshops region text" data-region="nav-workshops"><!-- Typeset semantic UI text: Warsztaty --><p style="font-size:var(--r-nav-workshops-font);line-height:1.05;margin:0">nav-workshops</p></div>
  <div class="r-nav-events region text" data-region="nav-events"><!-- Typeset semantic UI text: Wydarzenia --><p style="font-size:var(--r-nav-events-font);line-height:1.05;margin:0">nav-events</p></div>
  <div class="r-nav-shop region text" data-region="nav-shop"><!-- Typeset semantic UI text: Sklep --><p style="font-size:var(--r-nav-shop-font);line-height:1.05;margin:0">nav-shop</p></div>
  <div class="r-nav-language region text" data-region="nav-language"><!-- Typeset semantic UI text: PL / UK --><p style="font-size:var(--r-nav-language-font);line-height:1.05;margin:0">nav-language</p></div>
  <div class="r-nav-cta region control" data-region="nav-cta"><!-- Olive pill button Umów sesję: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-cta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-headline-first region text" data-region="headline-first"><!-- Typeset semantic UI text: Zatrzymaj się. --><p style="font-size:var(--r-headline-first-font);font-family:var(--r-headline-first-family),sans-serif;font-weight:var(--r-headline-first-weight);line-height:1.05;margin:0">headline-first</p></div>
  <div class="r-headline-second region text" data-region="headline-second"><!-- Typeset semantic UI text: Poczuj siebie. --><p style="font-size:var(--r-headline-second-font);font-family:var(--r-headline-second-family),sans-serif;font-weight:var(--r-headline-second-weight);line-height:1.05;margin:0">headline-second</p></div>
  <div class="r-methods region text" data-region="methods"><!-- Typeset semantic UI text: Brainspotting · Joga · Medytacja --><p style="font-size:var(--r-methods-font);line-height:1.05;margin:0">methods</p></div>
  <div class="r-intro region text" data-region="intro"><!-- Typeset semantic UI text: Przestrzeń na spotkanie z emocjami, ciałem i sobą. --><p style="font-size:var(--r-intro-font);line-height:1.05;margin:0">intro</p></div>
  <div class="r-hero-cta region control" data-region="hero-cta"><!-- Milk pill Umów sesję 1:1 and small olive circle arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop hero-cta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-note-shell region chrome" data-region="note-shell"><!-- Milk rectangular panel with gentle rounded corners --></div>
  <div class="r-note-label region text" data-region="note-label"><!-- Typeset semantic UI text: TERAPIA · JOGA · MEDYTACJA --><p style="font-size:var(--r-note-label-font);line-height:1.05;margin:0">note-label</p></div>
  <div class="r-note-title region text" data-region="note-title"><!-- Typeset semantic UI text: Czas czuć. --><p style="font-size:var(--r-note-title-font);line-height:1.05;margin:0">note-title</p></div>
  <div class="r-note-copy region text" data-region="note-copy"><!-- Typeset semantic UI text: W swoim tempie. --><p style="font-size:var(--r-note-copy-font);line-height:1.05;margin:0">note-copy</p></div>
  <div class="r-note-rule region chrome" data-region="note-rule"><!-- Short olive line --></div>
  <div class="r-philosophy-first region text" data-region="philosophy-first"><!-- Typeset semantic UI text: Nie musisz mieć wszystkiego poukładanego, --><p style="font-size:var(--r-philosophy-first-font);line-height:1.05;margin:0">philosophy-first</p></div>
  <div class="r-philosophy-second region text" data-region="philosophy-second"><!-- Typeset semantic UI text: żeby zacząć słuchać siebie. --><p style="font-size:var(--r-philosophy-second-font);line-height:1.05;margin:0">philosophy-second</p></div>
</main>
</body>
</html>
